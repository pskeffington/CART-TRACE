<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620">
  <rect width="100%" height="100%" fill="white"/>
  <text x="70" y="48" font-family="sans-serif" font-size="26" font-weight="bold">Figure 1. CART-TRACE clinical-data structuring and validation architecture</text>
  <text x="70" y="78" font-family="sans-serif" font-size="14">Retrospective research representation; source evidence, transformation, validation, and analysis remain auditable and distinct.</text>

  <g font-family="sans-serif">
    <rect x="70" y="145" width="220" height="210" rx="10" fill="#f5f5f5" stroke="#222"/>
    <text x="180" y="180" text-anchor="middle" font-size="18" font-weight="bold">1. Source records</text>
    <text x="90" y="220" font-size="13">Encounter / location records</text>
    <text x="90" y="248" font-size="13">Original timestamps + labels</text>
    <text x="90" y="276" font-size="13">Infusion timestamp</text>
    <text x="90" y="304" font-size="13">Source-record identifiers</text>
    <text x="90" y="332" font-size="13">Ambiguity preserved</text>

    <rect x="335" y="145" width="220" height="210" rx="10" fill="#f5f5f5" stroke="#222"/>
    <text x="445" y="180" text-anchor="middle" font-size="18" font-weight="bold">2. Staging</text>
    <text x="355" y="220" font-size="13">Offset-aware timestamps</text>
    <text x="355" y="248" font-size="13">Relative hours; infusion = 0</text>
    <text x="355" y="276" font-size="13">Versioned mapping</text>
    <text x="355" y="304" font-size="13">Precedence + stable ordering</text>
    <text x="355" y="332" font-size="13">Source provenance retained</text>

    <rect x="600" y="145" width="220" height="210" rx="10" fill="#f5f5f5" stroke="#222"/>
    <text x="710" y="180" text-anchor="middle" font-size="18" font-weight="bold">3. Canonical trajectory</text>
    <text x="620" y="220" font-size="13">Care-state intervals</text>
    <text x="620" y="248" font-size="13">Transitions</text>
    <text x="620" y="276" font-size="13">[start,end) semantics</text>
    <text x="620" y="304" font-size="13">Explicit unknown + uncertainty</text>
    <text x="620" y="332" font-size="13">Interval/transition provenance</text>

    <rect x="865" y="145" width="220" height="210" rx="10" fill="#f5f5f5" stroke="#222"/>
    <text x="975" y="180" text-anchor="middle" font-size="18" font-weight="bold">4. Validation / review</text>
    <text x="885" y="220" font-size="13">Structural conformance</text>
    <text x="885" y="248" font-size="13">Temporal plausibility</text>
    <text x="885" y="276" font-size="13">Semantic validity</text>
    <text x="885" y="304" font-size="13">Exact reconstruction fidelity</text>
    <text x="885" y="332" font-size="13">Reproducibility + analytic fitness</text>

    <rect x="1130" y="145" width="220" height="210" rx="10" fill="#f5f5f5" stroke="#222"/>
    <text x="1240" y="180" text-anchor="middle" font-size="18" font-weight="bold">5. Analytic outputs</text>
    <text x="1150" y="220" font-size="13">Metric-result representation</text>
    <text x="1150" y="248" font-size="13">Primary window [0,720)</text>
    <text x="1150" y="276" font-size="13">Observed / zero / unavailable</text>
    <text x="1150" y="304" font-size="13">Follow-up sufficiency</text>
    <text x="1150" y="332" font-size="13">Tables + figures</text>

    <g stroke="#333" stroke-width="2" fill="none">
      <line x1="290" y1="250" x2="335" y2="250"/>
      <line x1="555" y1="250" x2="600" y2="250"/>
      <line x1="820" y1="250" x2="865" y2="250"/>
      <line x1="1085" y1="250" x2="1130" y2="250"/>
    </g>
    <g fill="#333">
      <polygon points="335,250 323,243 323,257"/>
      <polygon points="600,250 588,243 588,257"/>
      <polygon points="865,250 853,243 853,257"/>
      <polygon points="1130,250 1118,243 1118,257"/>
    </g>

    <rect x="180" y="420" width="1040" height="110" rx="10" fill="#fafafa" stroke="#666" stroke-dasharray="6 4"/>
    <text x="700" y="452" text-anchor="middle" font-size="16" font-weight="bold">Cross-cutting audit controls</text>
    <text x="250" y="486" font-size="13">Source vocabulary + timestamps preserved</text>
    <text x="545" y="486" font-size="13">Versioned mapping + deterministic rules</text>
    <text x="875" y="486" font-size="13">Uncertainty never silently coerced to zero</text>
    <text x="410" y="514" font-size="13">Provenance retained across transformations</text>
    <text x="790" y="514" font-size="13">Synthetic validation ≠ external clinical validity</text>
  </g>
</svg>
