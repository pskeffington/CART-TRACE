name: Validate CART-TRACE

on:
  push:
    branches:
      - main
      - build/core-trajectory-model
  pull_request:
    paths:
      - 'cart_trace/**'
      - 'schemas/**'
      - 'config/**'
      - 'examples/synthetic/**'
      - 'scripts/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/validate-gate1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validation:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install project and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'

      - name: Run Gate 1 schema tests
        run: pytest -q tests/test_gate1_schemas.py

      - name: Generate controlled Phase 5 JSON outputs
        run: python scripts/generate_phase5_outputs.py

      - name: Render Phase 5 scholarly artifacts
        run: python scripts/render_phase5_outputs.py

      - name: Verify expected rendered artifacts
        run: |
          test -s examples/rendered/table3_validation.md
          test -s examples/rendered/table4_cohort_summary.md
          test -s examples/rendered/table5_uncertainty.md
          test -s examples/rendered/figure2_representative_trajectories.svg
          test -s examples/rendered/figure_s1_all_trajectories.svg

      - name: Run full test suite
        run: pytest -q
