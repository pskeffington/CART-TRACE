[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cart-trace"
version = "0.2.0"
description = "Synthetic-first research framework for CAR T-cell hospital care trajectories"
requires-python = ">=3.11"
dependencies = [
  "jsonschema>=4.22,<5"
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9"
]

[tool.setuptools]
packages = ["cart_trace"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
