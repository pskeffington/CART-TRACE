[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "cart-trace"
version = "0.1.0.dev0"
description = "Research-oriented longitudinal analytics scaffold for CAR T-cell therapy trajectories"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "TBD"}
authors = [{name = "Paul Skeffington"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
